[project]
name = "object-tracker"
version = "0.1.0"
description = "Object tracker (single video / batch directory)"
requires-python = ">=3.12"
dependencies = [
    # cv2.legacy の CSRT / MOSSE / MedianFlow などを使うため contrib 版が必要。
    # OpenCV 5 では legacy トラッカーが無くなるため 4.x に固定する。
    "opencv-contrib-python>=4.12.0.88,<5",
    "numpy>=2.2.6,<3",
    "pillow>=12.3.0",
]
